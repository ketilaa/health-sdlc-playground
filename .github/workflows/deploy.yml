name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_frontend: ${{ steps.check.outputs.has_frontend }}
    steps:
      - uses: actions/checkout@v5

      - name: Check frontend exists
        id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "has_frontend=true" >> $GITHUB_OUTPUT
          else
            echo "has_frontend=false" >> $GITHUB_OUTPUT
            echo "No frontend/package.json found — skipping deploy."
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.has_frontend == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.has_frontend == 'true'
        run: npm install
        working-directory: frontend

      - name: Build
        if: steps.check.outputs.has_frontend == 'true'
        run: npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify export output
        if: steps.check.outputs.has_frontend == 'true'
        run: |
          if [ ! -d frontend/out ]; then
            echo "ERROR: frontend/out not found — ensure next.config.js has output: 'export'"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.has_frontend == 'true'
        with:
          path: frontend/out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.has_frontend == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
