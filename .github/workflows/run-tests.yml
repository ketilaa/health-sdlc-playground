name: Run E2E Tests

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: write

jobs:
  run-tests:
    if: contains(github.event.head_commit.message, '[AGENT:tester]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Start app
        run: |
          npx serve out -p 3000 &
          sleep 5

      - name: Install Playwright browsers                                                                
        run: npx playwright install --with-deps chromium                                                 
  
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          APP_URL: http://localhost:3000

      - name: Mark tests passed
        if: success()
        run: |
          git config user.name "AI Bot"
          git config user.email "ai@bot.com"
          git commit --allow-empty -m "[TESTS:PASSED]"
          git push
