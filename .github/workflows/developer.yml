name: Developer

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: write
  issues: write

jobs:
  developer:
    if: contains(github.event.head_commit.message, '[NEXT:developer]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - run: pip install anthropic

      - name: Run Developer agent
        id: agent
        run: python .claude/scripts/run_developer.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Comment on issue (STOP)
        if: failure()
        run: |
          if [ -f features/.pipeline_context.json ]; then
            ISSUE=$(python3 -c "import json; print(json.load(open('features/.pipeline_context.json'))['issue_number'])")
            SUMMARY=$(cat features/*/work/developer-summary.md 2>/dev/null | head -30 \
              || echo "See workflow logs for details.")
            BODY=$(printf '**Pipeline STOP at: Developer**\n\n%s' "$SUMMARY")
            gh issue comment "$ISSUE" --body "$BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and trigger next
        if: success()
        run: |
          git config user.name "AI Bot"
          git config user.email "ai@bot.com"
          git add features/
          git add frontend/ 2>/dev/null || true
          git add backend/ 2>/dev/null || true
          git add infrastructure/ 2>/dev/null || true
          git commit -m "[NEXT:code-reviewer]"
          git push
