name: Implementation and Test

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: write
  issues: write

jobs:
  implementation-and-test:
    if: contains(github.event.head_commit.message, '[NEXT:implementation-and-test]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: pip install anthropic

      - name: Run Implementation and Test
        id: agent
        run: python .claude/scripts/run_implementation_and_test.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Comment on issue (STOP)
        if: failure()
        run: |
          if [ -f features/.pipeline_context.json ]; then
            ISSUE=$(python3 -c "import json; print(json.load(open('features/.pipeline_context.json'))['issue_number'])")
            SUMMARY=$(cat features/*/work/code-reviewer-summary.md 2>/dev/null \
              || cat features/*/work/developer-summary.md 2>/dev/null \
              | head -30 \
              || echo "See workflow logs for details.")
            BODY=$(printf '**Pipeline STOP at: Implementation and Test**\n\n%s' "$SUMMARY")
            gh issue comment "$ISSUE" --body "$BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and trigger next
        if: success()
        run: |
          git config user.name "AI Bot"
          git config user.email "ai@bot.com"
          git add features/
          git add run-tests.sh 2>/dev/null || true
          git add frontend/ 2>/dev/null || true
          git add backend/ 2>/dev/null || true
          git add infrastructure/ 2>/dev/null || true
          if git diff --staged --quiet; then
            git commit --allow-empty -m "[NEXT:tester]"
          else
            git commit -m "[NEXT:tester]"
          fi
          git pull --rebase
          git push
