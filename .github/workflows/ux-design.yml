name: UX Design

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: write
  issues: write

jobs:
  ux-design:
    if: contains(github.event.head_commit.message, '[NEXT:ux-design]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - run: pip install anthropic

      - name: Run UX Design
        id: agent
        run: python -u .claude/scripts/run_ux_design.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Comment on issue (STOP)
        if: failure()
        run: |
          if [ -f features/.pipeline_context.json ]; then
            ISSUE=$(python3 -c "import json; print(json.load(open('features/.pipeline_context.json'))['issue_number'])")
            SUMMARY=$(cat features/*/work/ux-reviewer-summary.md 2>/dev/null \
              || cat features/*/work/ux-designer-summary.md 2>/dev/null \
              | head -30 \
              || echo "See workflow logs for details.")
            BODY=$(printf '**Pipeline STOP at: UX Design**\n\n%s' "$SUMMARY")
            gh issue comment "$ISSUE" --body "$BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and trigger next
        if: success()
        run: |
          git config user.name "AI Bot"
          git config user.email "ai@bot.com"
          git add features/
          if git diff --staged --quiet; then
            git commit --allow-empty -m "[NEXT:implementation-and-test]"
          else
            git commit -m "[NEXT:implementation-and-test]"
          fi
          git pull --rebase
          git push
