name: Feature Specification

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  feature-specification:
    if: contains(github.event.issue.labels.*.name, 'direct-feature')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Create feature branch
        id: branch
        run: |
          FEATURE=$(echo "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/-\{2,\}/-/g' \
            | sed 's/^-\|-$//g')
          echo "feature_name=$FEATURE" >> $GITHUB_OUTPUT
          git fetch origin "feature/$FEATURE" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/feature/$FEATURE"; then
            git checkout -b "feature/$FEATURE" "origin/feature/$FEATURE"
          else
            git checkout -b "feature/$FEATURE"
            git push -u origin "feature/$FEATURE"
          fi
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}

      - name: Save input and pipeline context
        run: |
          FEATURE="${{ steps.branch.outputs.feature_name }}"
          mkdir -p "features/$FEATURE"
          printf '%s' "$ISSUE_BODY" > "features/$FEATURE/feature.txt"
          printf '{"issue_number":%s,"feature_name":"%s","issue_author":"%s"}\n' \
            "${{ github.event.issue.number }}" \
            "${{ steps.branch.outputs.feature_name }}" \
            "${{ github.event.issue.user.login }}" \
            > features/.pipeline_context.json
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - run: pip install -r requirements.txt

      - name: Run Feature Specification
        id: agent
        run: python -u .claude/scripts/run_feature_specification.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Comment on issue (STOP)
        if: failure()
        run: |
          FEATURE="${{ steps.branch.outputs.feature_name }}"
          if [ -n "$FEATURE" ]; then
            SUMMARY=$(cat "features/$FEATURE/work/feature-reviewer-summary.md" 2>/dev/null \
              || cat "features/$FEATURE/work/product-owner-summary.md" 2>/dev/null \
              | head -30 \
              || echo "See workflow logs for details.")
          else
            SUMMARY="Pipeline failed at branch creation. See workflow logs for details."
          fi
          BODY=$(printf '**Pipeline STOP at: Feature Specification**\n\n%s' "$SUMMARY")
          gh issue comment "${{ github.event.issue.number }}" --body "$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit agent work (always)
        if: always()
        run: |
          git config user.name "AI Bot"
          git config user.email "ai@bot.com"
          git add features/
          git diff --staged --quiet || git commit -m "chore: agent work output [no-trigger]"
          git pull --rebase origin "feature/${{ steps.branch.outputs.feature_name }}" || true
          git push || true

      - name: Trigger next stage
        if: success()
        run: |
          git commit --allow-empty -m "[NEXT:ux-design]"
          git pull --rebase origin "feature/${{ steps.branch.outputs.feature_name }}"
          git push
