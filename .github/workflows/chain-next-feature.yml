name: Chain Next Feature

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  chain:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'feature/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Create next feature issue if plan has remaining features
        run: python3 .github/scripts/chain_next_feature.py
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
