name: Update System State

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: write

jobs:
  update-system-state:
    if: contains(github.event.head_commit.message, '[NEXT:update-system-state]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - run: pip install -r requirements.txt

      - name: Run System State Updater
        run: python -u .claude/scripts/run_system_state_update.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit updated system state
        if: always()
        run: |
          git config user.name "AI Bot"
          git config user.email "ai@bot.com"
          git add system/ features/
          git diff --staged --quiet || git commit -m "chore: update system state after ${{ github.ref_name }} [no-trigger]"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push || true
