name: Implement and Test

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: write
  issues: write

jobs:
  implement-and-test:
    if: contains(github.event.head_commit.message, '[NEXT:implementation-and-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install E2E dependencies
        run: npm install
        working-directory: e2e

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Install Playwright system deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: e2e

      - run: pip install anthropic

      - name: Run Implement and Test
        id: agent
        run: python -u .claude/scripts/run_implement_and_test.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKIP_E2E: '1'

      - name: Comment on issue (STOP)
        if: failure()
        run: |
          if [ -f features/.pipeline_context.json ]; then
            ISSUE=$(python3 -c "import json; print(json.load(open('features/.pipeline_context.json'))['issue_number'])")
            SUMMARY=$(cat features/*/work/tester-summary.md 2>/dev/null \
              || cat features/*/work/code-reviewer-summary.md 2>/dev/null \
              || cat features/*/work/developer-summary.md 2>/dev/null \
              | head -30 \
              || echo "See workflow logs for details.")
            BODY=$(printf '**Pipeline STOP at: Implement and Test**\n\n%s' "$SUMMARY")
            gh issue comment "$ISSUE" --body "$BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit agent work (always)
        if: always()
        run: |
          git config user.name "AI Bot"
          git config user.email "ai@bot.com"
          git add features/
          git add run-tests.sh 2>/dev/null || true
          git add run-e2e.sh 2>/dev/null || true
          git add frontend/ 2>/dev/null || true
          git add backend/ 2>/dev/null || true
          git add infrastructure/ 2>/dev/null || true
          git add e2e/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: agent work output [no-trigger]"
          git pull --no-rebase -X ours
          git push

      - name: Trigger next stage
        if: success()
        run: |
          git commit --allow-empty -m "[NEXT:calibrate]"
          git pull --no-rebase -X ours
          git push
