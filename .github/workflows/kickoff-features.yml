name: Kickoff Features

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  kickoff:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'plan/issue-')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Create first feature issue from backlog
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          ISSUE_NUM="${BRANCH#plan/issue-}" python3 .github/scripts/kickoff_features.py
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
