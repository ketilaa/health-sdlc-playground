name: Create PR

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    if: contains(github.event.head_commit.message, '[NEXT:create-pr]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Read pipeline context
        id: ctx
        run: |
          FEATURE=$(python3 -c "import json; print(json.load(open('features/.pipeline_context.json'))['feature_name'])")
          ISSUE=$(python3 -c "import json; print(json.load(open('features/.pipeline_context.json'))['issue_number'])")
          echo "feature_name=$FEATURE" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE" >> $GITHUB_OUTPUT

      - name: Create or update pull request
        run: |
          FEATURE="${{ steps.ctx.outputs.feature_name }}"
          ISSUE="${{ steps.ctx.outputs.issue_number }}"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          PO_SUMMARY=$(head -20 "features/$FEATURE/work/product-owner-summary.md" 2>/dev/null || echo "")
          BODY=$(printf 'Closes #%s\n\n%s\n\n## Agent Pipeline\n\nAll agents returned STATUS: OK. E2E tests passed.\n\nSee `features/%s/work/` for individual agent summaries.' \
            "$ISSUE" "$PO_SUMMARY" "$FEATURE")
          if gh pr view "$BRANCH" --json number -q .number > /dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "feat: $FEATURE" --body "$BODY"
          else
            gh pr create \
              --title "feat: $FEATURE" \
              --body "$BODY" \
              --base main \
              --head "$BRANCH"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Trigger system state update
        if: success()
        run: |
          git config user.name "AI Bot"
          git config user.email "ai@bot.com"
          git commit --allow-empty -m "[NEXT:update-system-state]"
          git pull --rebase origin "feature/${{ steps.ctx.outputs.feature_name }}" || true
          git push
