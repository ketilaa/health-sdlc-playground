name: Create PR

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    if: contains(github.event.head_commit.message, '[TESTS:PASSED]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Read pipeline context
        id: ctx
        run: |
          FEATURE=$(python3 -c "import json; print(json.load(open('features/.pipeline_context.json'))['feature_name'])")
          ISSUE=$(python3 -c "import json; print(json.load(open('features/.pipeline_context.json'))['issue_number'])")
          echo "feature_name=$FEATURE" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE" >> $GITHUB_OUTPUT

      - name: Create pull request
        run: |
          FEATURE="${{ steps.ctx.outputs.feature_name }}"
          ISSUE="${{ steps.ctx.outputs.issue_number }}"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          PO_SUMMARY=$(head -20 "features/$FEATURE/work/product-owner-summary.md" 2>/dev/null || echo "")
          BODY=$(printf 'Closes #%s\n\n%s\n\n## Agent Pipeline\n\nAll agents returned STATUS: OK. E2E tests passed.\n\nSee `features/%s/work/` for individual agent summaries.' \
            "$ISSUE" "$PO_SUMMARY" "$FEATURE")
          gh pr create \
            --title "feat: $FEATURE" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
